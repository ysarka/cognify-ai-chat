services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognify
      POSTGRES_PASSWORD: cognify_password
      POSTGRES_DB: cognify
    ports:
      - '5432:5432'
    volumes:
      - cognify_postgres_data:/var/lib/postgresql/data

volumes:
  cognify_postgres_data:
