<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cognify — Offline</title>
        <meta name="theme-color" content="#111827" />
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Arial, Helvetica, sans-serif;
                background: radial-gradient(circle at top, #1f2937, transparent 35%), #111827;
                color: #f9fafb;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            main {
                width: min(100%, 440px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 24px;
                background: rgba(17, 24, 39, 0.82);
                box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
                padding: 32px;
                text-align: center;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 64px;
                height: 64px;
                border-radius: 999px;
                background: #2563eb;
                margin-bottom: 20px;
                font-size: 30px;
            }

            h1 {
                margin: 0 0 12px;
                font-size: 32px;
            }

            p {
                margin: 0;
                color: #d1d5db;
                line-height: 1.6;
            }

            a {
                display: inline-block;
                margin-top: 24px;
                color: #bfdbfe;
                font-weight: 700;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="badge">✈️</div>
            <h1>You are offline</h1>
            <p>
                Cognify cannot reach the internet right now. Turn off airplane mode or reconnect to Wi-Fi, then open the
                app again.
            </p>
            <a href="/">Try opening Cognify again</a>
        </main>
    </body>
</html>
